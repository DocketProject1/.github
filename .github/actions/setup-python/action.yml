name: Setup Python and run build/test
description: >
  Installs Python and the service's dependencies, then runs its build and test
  commands as two distinct steps, so a failure in one is never reported as the other.

inputs:
  working-directory:
    description: Directory containing the requirements files
    required: true
  runtime-version:
    description: >
      Python version to install. Defaults to 3.11, matching the runtime documented in
      docket-log-message-processor's CLAUDE.md.
    required: false
    default: "3.11"
  build-command:
    description: >
      Shell command that installs dependencies. Skipped when empty; a typical value
      is "pip install -r requirements.lock" or "-r requirements-test.txt" when tests
      need extra packages.
    required: false
    default: ""
  test-command:
    description: Shell command that runs the service's test suite
    required: true
  coverage-report-path:
    description: >
      Path (relative to working-directory) to the coverage report the test command
      produces, if any. Not read by this action directly; passed through so the
      caller workflow can hand it to the analysis stage.
    required: false
    default: ""

outputs:
  build-outcome:
    description: "success, failure, or skipped, from the build step"
    value: ${{ steps.build.outcome }}
  test-outcome:
    description: "success or failure, from the test step"
    value: ${{ steps.test.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.runtime-version }}

    - name: Build (install dependencies)
      id: build
      if: inputs.build-command != ''
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Test
      id: test
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: Fail the action if build or test failed
      shell: bash
      run: |
        build_outcome="${{ steps.build.outcome }}"
        test_outcome="${{ steps.test.outcome }}"
        if [ -n "$build_outcome" ] && [ "$build_outcome" != "success" ]; then
          echo "::error::build step failed (outcome=$build_outcome)"
          exit 1
        fi
        if [ "$test_outcome" != "success" ]; then
          echo "::error::test step failed (outcome=$test_outcome)"
          exit 1
        fi
