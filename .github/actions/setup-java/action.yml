name: Setup Java and run build/test
description: >
  Installs the Temurin JDK, then runs the calling service's build and test commands
  as two distinct steps, so a failure in one is never reported as the other.

inputs:
  working-directory:
    description: Directory containing the Maven project (pom.xml)
    required: true
  runtime-version:
    description: >
      JDK version to install. Defaults to 8, matching the Java 8 pin documented in
      docket-users-api's CLAUDE.md (Spring Boot 1.5.6 does not start on newer JDKs).
    required: false
    default: "8"
  build-command:
    description: >
      Shell command that builds the service. Skipped when empty — Maven's own
      test-command typically covers both (e.g. "mvn clean verify").
    required: false
    default: ""
  test-command:
    description: Shell command that runs the service's build and/or test suite
    required: true
  coverage-report-path:
    description: >
      Path (relative to working-directory) to the coverage report the test command
      produces, if any. Not read by this action directly; passed through so the
      caller workflow can hand it to the analysis stage.
    required: false
    default: ""

outputs:
  build-outcome:
    description: "success, failure, or skipped, from the build step"
    value: ${{ steps.build.outcome }}
  test-outcome:
    description: "success or failure, from the test step"
    value: ${{ steps.test.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.runtime-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

    - name: Build
      id: build
      if: inputs.build-command != ''
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Test
      id: test
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: Fail the action if build or test failed
      shell: bash
      run: |
        build_outcome="${{ steps.build.outcome }}"
        test_outcome="${{ steps.test.outcome }}"
        if [ -n "$build_outcome" ] && [ "$build_outcome" != "success" ]; then
          echo "::error::build step failed (outcome=$build_outcome)"
          exit 1
        fi
        if [ "$test_outcome" != "success" ]; then
          echo "::error::test step failed (outcome=$test_outcome)"
          exit 1
        fi
