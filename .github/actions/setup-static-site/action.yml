name: Setup Node (static site) and run build/test
description: >
  Installs the older Node.js version a legacy frontend build toolchain requires, then
  runs its build and test (typically lint) commands as two distinct steps, so a
  failure in one is never reported as the other. Separate from setup-node because a
  static-site build (e.g. webpack 2 + node-sass) can be pinned to a Node version the
  service's own runtime no longer uses.

inputs:
  working-directory:
    description: Directory containing package.json
    required: true
  runtime-version:
    description: >
      Node.js version to install for the build. Defaults to 8, matching
      docket-frontend's Dockerfile build stage (webpack 2 / node-sass 4.5 only ship
      precompiled binaries for Node 8).
    required: false
    default: "8"
  build-command:
    description: Shell command that builds the service. Skipped when empty.
    required: false
    default: ""
  test-command:
    description: >
      Shell command that stands in for a test suite. Per this feature's spec, this is
      expected to be a lint command (e.g. "npm run lint") until a real test suite
      exists for the frontend.
    required: true
  coverage-report-path:
    description: >
      Path (relative to working-directory) to a coverage report, if any. Expected to
      be empty for this action today — no coverage report exists for a lint-only
      check.
    required: false
    default: ""

outputs:
  build-outcome:
    description: "success, failure, or skipped, from the build step"
    value: ${{ steps.build.outcome }}
  test-outcome:
    description: "success or failure, from the test step"
    value: ${{ steps.test.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.runtime-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Test (lint)
      id: test
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: Build
      id: build
      if: inputs.build-command != ''
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Fail the action if build or test failed
      shell: bash
      run: |
        build_outcome="${{ steps.build.outcome }}"
        test_outcome="${{ steps.test.outcome }}"
        if [ -n "$build_outcome" ] && [ "$build_outcome" != "success" ]; then
          echo "::error::build step failed (outcome=$build_outcome)"
          exit 1
        fi
        if [ "$test_outcome" != "success" ]; then
          echo "::error::test step failed (outcome=$test_outcome)"
          exit 1
        fi
