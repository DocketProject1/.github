name: Docket service CI

# Shared across every DocketProject1 service repository. The source of truth is
# DocketProject1/.github's .github/workflows/ci.yml; a caller repository never edits
# a copy of this file, it references this one by a pinned commit SHA or tag. See
# specs/001-reusable-ci-pipelines/contracts/ci-workflow-contract.md for the full
# contract this file promises to every caller.
#
# CI builds and publishes artifacts only. It MUST NOT deploy anything — see
# constitution principle 5. There is deliberately no step anywhere in this file that
# touches a Kubernetes cluster, Argo CD, or any running environment.

on:
  workflow_call:
    inputs:
      language:
        description: "go | java | node | python | static-site"
        type: string
        required: true
      working-directory:
        description: Directory containing the service's own source, relative to its repository root
        type: string
        required: true
      build-command:
        description: Shell command that builds the service. Skipped when empty.
        type: string
        required: false
        default: ""
      test-command:
        description: Shell command that runs the service's existing automated test command
        type: string
        required: true
      dockerfile-path:
        description: Path to the service's own multi-stage Dockerfile, relative to working-directory
        type: string
        required: false
        default: Dockerfile
      image-name:
        description: Unqualified GHCR image name for this service
        type: string
        required: true
      coverage-report-path:
        description: Path (relative to working-directory) to the coverage report the test command produces, if any. Coverage stage is skipped when empty.
        type: string
        required: false
        default: ""
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token. When absent, the analyze job reports skipped, not failed.
        required: false
      CHAT_WEBHOOK_URL:
        description: Chat webhook for failure notifications. When absent, the notify job reports skipped, not failed.
        required: false
    outputs:
      version:
        description: The version published from this run, or empty if this run did not publish
        value: ${{ jobs.publish.outputs.version }}
      image-ref:
        description: Full ghcr.io reference published from this run, or empty if this run did not publish
        value: ${{ jobs.publish.outputs.image-ref }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-test:
    name: Build and test (${{ inputs.language }})
    runs-on: ubuntu-latest
    outputs:
      build-result: ${{ steps.dispatch.outputs.build-outcome }}
      test-result: ${{ steps.dispatch.outputs.test-outcome }}
      image-tag: ${{ steps.image-tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # Exactly one of these runs, selected by inputs.language. Each composite action
      # runs build and test as two distinct steps internally (FR-005, FR-009: a build
      # failure is never reported as a test failure or vice versa) and re-exposes both
      # outcomes here under one stable output name regardless of language.
      - name: Build and test (go)
        id: dispatch-go
        if: inputs.language == 'go'
        uses: ./.github/actions/setup-go
        with:
          working-directory: ${{ inputs.working-directory }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          coverage-report-path: ${{ inputs.coverage-report-path }}

      - name: Build and test (java)
        id: dispatch-java
        if: inputs.language == 'java'
        uses: ./.github/actions/setup-java
        with:
          working-directory: ${{ inputs.working-directory }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          coverage-report-path: ${{ inputs.coverage-report-path }}

      - name: Build and test (node)
        id: dispatch-node
        if: inputs.language == 'node'
        uses: ./.github/actions/setup-node
        with:
          working-directory: ${{ inputs.working-directory }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          coverage-report-path: ${{ inputs.coverage-report-path }}

      - name: Build and test (python)
        id: dispatch-python
        if: inputs.language == 'python'
        uses: ./.github/actions/setup-python
        with:
          working-directory: ${{ inputs.working-directory }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          coverage-report-path: ${{ inputs.coverage-report-path }}

      - name: Build and test (static-site)
        id: dispatch-static-site
        if: inputs.language == 'static-site'
        uses: ./.github/actions/setup-static-site
        with:
          working-directory: ${{ inputs.working-directory }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          coverage-report-path: ${{ inputs.coverage-report-path }}

      - name: Normalize dispatch outcome
        id: dispatch
        if: always()
        shell: bash
        run: |
          build_outcome="${{ steps.dispatch-go.outputs.build-outcome || steps.dispatch-java.outputs.build-outcome || steps.dispatch-node.outputs.build-outcome || steps.dispatch-python.outputs.build-outcome || steps.dispatch-static-site.outputs.build-outcome }}"
          test_outcome="${{ steps.dispatch-go.outputs.test-outcome || steps.dispatch-java.outputs.test-outcome || steps.dispatch-node.outputs.test-outcome || steps.dispatch-python.outputs.test-outcome || steps.dispatch-static-site.outputs.test-outcome }}"
          echo "build-outcome=$build_outcome" >> "$GITHUB_OUTPUT"
          echo "test-outcome=$test_outcome" >> "$GITHUB_OUTPUT"

      # Container build is its own step, after language build/test, so a Dockerfile
      # break is reported distinctly from a test failure (spec.md edge case). It
      # always builds (even on a PR, so User Story 2 can scan it) but never pushes
      # here — publish is a separate job, gated to a trunk merge that passed every
      # gate (FR-012).
      - name: Compute local image tag
        id: image-tag
        shell: bash
        run: echo "value=pr-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build container image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile-path }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:${{ steps.image-tag.outputs.value }}

  # Static analysis is its own job, distinct from build-test and scan, so a
  # contributor can tell which kind of problem they need to fix (FR-009). A fork pull
  # request cannot see SONAR_TOKEN, so this job reports skipped rather than a false
  # failure caused by a missing credential (FR-017).
  analyze:
    name: Static analysis (SonarQube Cloud)
    needs: build-test
    if: needs.build-test.outputs.build-result == 'success' && needs.build-test.outputs.test-result == 'success' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The coverage report was produced by the test step inside build-test's
      # dispatched composite action; re-run is unnecessary here since SonarQube Cloud
      # only needs the report file, which sonar-project.properties already points at.
      # Coverage enforcement itself is a SonarQube Cloud project quality-gate setting,
      # not workflow logic (research.md #4), so it starts report-only per service
      # until that service has a real baseline, and is only ever raised through its
      # own reviewed change to that setting.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Vulnerability scanning always runs, on every pull request and trunk push alike,
  # because it needs no organization secret (FR-017) and User Story 2 requires a
  # vulnerable image to fail before merge, not only after (research.md #5).
  scan:
    name: Container vulnerability scan (Trivy)
    needs: build-test
    if: needs.build-test.outputs.build-result == 'success' && needs.build-test.outputs.test-result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile-path }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:${{ needs.build-test.outputs.image-tag }}

      # Fails the job only on a Critical finding (research.md #5, per the maintainer's
      # ratchet decision). High-severity findings are still reported via the SARIF
      # upload below, visible on the pull request without blocking it, until the
      # severity threshold is raised through its own separate reviewed change
      # (FR-008).
      - name: Trivy scan (Critical blocks, High is reported)
        id: trivy-blocking
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ needs.build-test.outputs.image-tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Trivy scan (report Critical and High as SARIF)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ needs.build-test.outputs.image-tag }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Computed only on a trunk push — a pull request never needs a version, since it
  # never publishes (FR-012). Reads Conventional Commit history since the last tag,
  # which every repo already enforces via sdd-conventions.yml (research.md #2).
  version:
    name: Compute version
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"

  # Publishes only on a trunk push where every prior gate succeeded — never from a
  # pull request run, and never when analysis or scanning failed (FR-011, FR-012;
  # contract guarantee 2). analyze is allowed to be 'skipped' (fork PRs can't reach
  # trunk, but a repo without SONAR_TOKEN configured yet must not be permanently
  # unable to publish) — scan is never allowed to be anything but 'success'.
  publish:
    name: Publish image
    needs: [build-test, analyze, scan, version]
    if: |
      github.event_name == 'push' &&
      needs.build-test.result == 'success' &&
      needs.scan.result == 'success' &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
      image-ref: ${{ steps.publish.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        shell: bash
        run: |
          # GHCR requires a lowercase repository path.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner}/${{ inputs.image-name }}:${{ needs.version.outputs.version }}"
          echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ steps.publish.outputs.image-ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

